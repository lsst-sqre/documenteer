[project]
title = "Documenteer"
copyright = "2015-2022 Association of Universities for Research in Astronomy, Inc. (AURA)"
base_url = "https://documenteer.lsst.io"
github_url = "https://github.com/lsst-sqre/documenteer"

[project.python]
package = "documenteer"

# This site's own citations. Every citation card, inline DOI link, and
# footer citation in docs/guides/citations/ is rendered from these entries.
[[project.citations]]
cff = "../CITATION.cff"
label = "Software"
preferred = true
note = "Cite the version of Documenteer you used; this site documents the version shown."

[[project.citations]]
doi = "10.26624/XWGH8202"
label = "Paper"
type = "article"
bibtex_key = "2025ASPC..541..151S"
in_footer = false
title = "The Documentation Developer Experience: Documentation Engineering at the Vera C. Rubin Observatory"
publisher = "Astronomical Society of the Pacific"
date = 2025
authors = [
    { family_name = "Sick", given_name = "Jonathan", orcid = "https://orcid.org/0000-0003-3001-676X", affiliation = "Vera C. Rubin Observatory" },
    { family_name = "Economou", given_name = "Frossie", affiliation = "Vera C. Rubin Observatory" },
]
note = "Cite this paper when describing how Rubin Observatory builds its documentation."

[sphinx]
extensions = [
  "sphinx_click.ext",
  "sphinxcontrib.autoprogram",
  "sphinxcontrib.autodoc_pydantic"
]
disable_primary_sidebars = ["index", "changelog"]
rst_epilog_file = "_rst_epilog.rst"
nitpicky = true
nitpick_ignore = [
  ["py:obj", "sphinx_automodapi.automodapi"],
]
nitpick_ignore_regex = [
  ['py:.*', 'docutils.*'],
  ['py:.*', 'pydantic.*'],
]
python_api_dir = "dev/api/contents"
exclude = [
  "technotes/_templates/*",
  "_templates/**"
]

[sphinx.theme]
header_links_before_dropdown = 5

[sphinx.intersphinx.projects]
python = "https://docs.python.org/3/"
requests = "https://requests.readthedocs.io/en/latest/"
developer = "https://developer.lsst.io/"
sphinx = "https://www.sphinx-doc.org/en/master/"
sphinxcontrib-bibtex = "https://sphinxcontrib-bibtex.readthedocs.io/en/latest/"
technote = "https://technote.lsst.io/"

[sphinx.linkcheck]
ignore = [
    "https://mermaid-js.github.io",
    "https://rubin-obs.slack.com",
    "https://slack.com/app_redirect",
    # github.dev redirects to the vscode.dev SPA, which doesn't finish
    # loading within linkcheck's timeout and reports a false-positive timeout.
    "https://github.dev",
    # ascl.net serves an incomplete TLS certificate chain, so linkcheck's
    # verification fails even though the site is available in browsers.
    "https://ascl.net",
    # The FORCE11 software-citation DOI resolves to peerj.com, which answers
    # linkcheck's requests with 403 Forbidden (bot blocking); the article is
    # reachable in a browser.
    "https://doi.org/10.7717/peerj-cs.86",
]

[sphinx.redirects]
"pipelines/build-overview.rst" = "guides/index.rst"
"pipelines/configuration.rst" = "guides/index.rst"
"pipelines/cpp-api-linking.rst" = "guides/index.rst"
"pipelines/index.rst" = "guides/index.rst"
"pipelines/install.rst" = "guides/index.rst"
"pipelines/package-docs-cli.rst" = "guides/index.rst"
"pipelines/stack-docs-cli.rst" = "guides/index.rst"
# The user-guide citations page grew into a section with an overview, recipes,
# and a page per display surface. The old single page is linked from released
# changelogs, so its path keeps resolving to the section's overview.
"guides/citations.rst" = "guides/citations/index.rst"
# Technote lint rules gained a rule-set prefix: the Rubin-specific rules moved
# from TN to R codes, and their landing pages moved with them. Links to the old
# pages are in the wild (a lint finding's "Learn more" footer prints the page
# URL), so the old paths keep resolving.
"technotes/lint/tn002.rst" = "technotes/lint/r002.rst"
"technotes/lint/tn003.rst" = "technotes/lint/r003.rst"
"technotes/lint/tn101.rst" = "technotes/lint/r101.rst"
"technotes/lint/tn102.rst" = "technotes/lint/r102.rst"
"technotes/lint/tn103.rst" = "technotes/lint/r103.rst"
