# Vale configuration for Documenteer's documentation.
#
# Vale (https://vale.sh) provides advisory editorial linting of the prose in
# docs/. Findings are informational: they never fail CI, and the nox session
# is not part of the default sessions or the prek hooks. See docs/dev/vale.rst
# for how to run and tune Vale.
#
# The Google package (styles/Google) is synced by `vale sync` and is
# gitignored; the Documenteer style (styles/Documenteer) and vocabulary
# (styles/config/vocabularies/Documenteer) are committed.

StylesPath = styles

# External style packages downloaded by `vale sync`.
Packages = Google

# Project vocabulary (styles/config/vocabularies/Documenteer/accept.txt).
Vocab = Documenteer

# Accept RST prose natively. Vale shells out to rst2html (docutils), which the
# `vale` dependency group and the CI job install alongside Vale.
[*.{rst,md}]
BasedOnStyles = Vale, Google, Documenteer

# --- Tuning (see docs/dev/vale.rst) -----------------------------------------
# Google rules demoted or disabled because they produce a high volume of
# low-value flags on this corpus. Each carries a one-line rationale.

# Sentence-length heuristic fires constantly on legitimate technical prose.
Google.Sentences = NO

# Passive-voice detection is noisy and often wrong on procedural docs.
Google.Passive = NO

# Heading capitalization: this repo uses sentence case (checked by review),
# but Google.Headings mis-parses RST directive titles and product names.
Google.Headings = NO

# "Will"/future tense is idiomatic in migration and release prose.
Google.Will = suggestion

# Ordinal/spelled-number and units rules flag many correct technical usages.
Google.Units = suggestion
Google.Ordinal = suggestion

# House style permits contractions, and this rule agrees (it suggests
# "don't" over "do not"), so keep it as a low-key suggestion.
Google.Contractions = suggestion

# Documenteer.We replaces Google.We (same "we" rule, with our wording/link).
Google.We = NO

# "RST", "TOML", "API", "DOI" etc. appear on nearly every page; spelling them
# out on each mention is not this project's convention.
Google.Acronyms = NO

# Parenthetical asides are common and acceptable in this reference prose.
Google.Parens = NO

# Google.Latin flags "e.g."/"i.e.", which house style permits. Disable.
Google.Latin = NO

# Vale.Terms enforces case consistency across the whole corpus and fires (at
# error level) on tokens that are correct in context: "sphinx" inside package
# and module names versus "Sphinx" the project. Too noisy to be useful here.
Vale.Terms = NO

# Em-dash spacing preference; house style is relaxed about this.
Google.EmDash = NO

# Exclamation is covered adequately; keep as a suggestion.
Google.Exclamation = suggestion

# Google's word list prefers "preceding" over "above" and "app" over
# "application", which misfire on "the example above" and on the Sphinx
# application object (the two together were most of the warnings on this
# corpus). Keep the list visible, but as suggestions.
Google.WordList = suggestion
Google.WordListCase = suggestion

# "Lowercase the first word after a colon" fires mostly on proper nouns here
# (Sphinx, Rubin, Documenteer, Zenodo).
Google.Colons = suggestion

# --- Path exclusions --------------------------------------------------------
# These paths are excluded from linting. Vale merges glob sections, so an
# excluded section must both clear BasedOnStyles *and* silence every rule that
# was individually demoted above (Vale keeps a per-rule key set in a broader
# section unless a narrower section overrides it).

# Symlink to the scriv-generated CHANGELOG.md; edit changelog.d/ fragments.
[docs/changelog.md]
BasedOnStyles =
Google.Will = NO
Google.Units = NO
Google.Ordinal = NO
Google.Exclamation = NO
Google.Contractions = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO

# Shared link targets only; no prose.
[docs/_rst_epilog.rst]
BasedOnStyles =
Google.Will = NO
Google.Units = NO
Google.Ordinal = NO
Google.Exclamation = NO
Google.Contractions = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO

# Generated automodapi API stubs.
[docs/dev/api/contents/**]
BasedOnStyles =
Google.Will = NO
Google.Units = NO
Google.Ordinal = NO
Google.Exclamation = NO
Google.Contractions = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO

# Technote templates, excluded from the Sphinx build as well.
[docs/technotes/_templates/**]
BasedOnStyles =
Google.Will = NO
Google.Units = NO
Google.Ordinal = NO
Google.Exclamation = NO
Google.Contractions = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO
