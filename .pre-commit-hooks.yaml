# Hooks a technote repository can use by adding this repository to its
# .pre-commit-config.yaml. See
# https://documenteer.lsst.io/technotes/citation-file.html
- id: technote-sync-cff
  name: Sync CITATION.cff with technote.toml
  description: >-
    Regenerate a technote's CITATION.cff from the metadata in technote.toml,
    so that GitHub's "Cite this repository" button offers a proper technote
    citation.
  entry: documenteer technote sync-cff
  language: python
  files: ^technote\.toml$
  pass_filenames: false
