# The full user-guide stack for a site that states its citations' shared
# fields once, in [project.citation_defaults], and whose table is missing the
# date -- which is how a site of forty data products loses every one of their
# dates at once. The undated-citation warning has to name the table this site
# wrote, and not only the entry below, which is the one place its author
# should not write the date.
[project]
title = "Citation Defaults Guide"
base_url = "https://example.lsst.io"
github_url = "https://github.com/lsst-sqre/documenteer"

[project.citation_defaults]
type = "dataset"
publisher = "NSF-DOE Vera C. Rubin Observatory"
authors = [
    { name = "NSF-DOE Vera C. Rubin Observatory", ror = "https://ror.org/048g3cy84" },
]

[[project.citations]]
doi = "10.71929/rubin/3382539"
label = "Butler"
self = true
title = "DP2 Object catalog (Butler)"
