# A technote registered with a DOI that declares no date_updated, which is
# most of the fleet. The technote package derives date_updated from the
# committer date of the published commit whenever the file omits the field,
# so this root -- built inside a git repository the test makes -- is what
# proves the citation is dated by that commit. date_created is declared
# because a derived date is clamped to it, and because the build also proves
# it is never read as the citation's date.
[technote]
id = "SQR-000"
series_id = "SQR"
canonical_url = "https://sqr-000.lsst.io/"
github_url = "https://github.com/lsst-sqre/sqr-000"
github_default_branch = "main"
date_created = 2024-01-02
version = "1.0.0"
doi = "10.71929/rubin/2570545"

[technote.organization]
name = "Vera C. Rubin Observatory"
ror = "https://ror.org/048g3cy84"

[[technote.authors]]
name.given = "Jonathan"
name.family = "Sick"
orcid = "https://orcid.org/0000-0003-3001-676X"

[[technote.authors.affiliations]]
name = "Vera C. Rubin Observatory"

[[technote.authors]]
name.given = "Ada"
name.family = "Lovelace"
