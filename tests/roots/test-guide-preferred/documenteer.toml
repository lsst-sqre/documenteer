# The full user-guide stack for a site whose preferred citation is a work
# published somewhere else -- the shape a repository whose CITATION.cff
# declares a preferred-citation has. The site asks readers to cite the paper,
# but the paper's landing page is its publisher's, so nothing is marked
# self = true and no page of this site claims to be a DOI's landing page.
[project]
title = "Preferred Citation Guide"
base_url = "https://example.lsst.io"
github_url = "https://github.com/lsst-sqre/documenteer"

[[project.citations]]
doi = "10.1117/12.2629569"
label = "Paper"
type = "article"
preferred = true
note = "Cite this paper in publications that use the package."
title = "The Vera C. Rubin Observatory Data Butler"
publisher = "SPIE"
date = 2022-08-27
authors = [
    { family_name = "Jenness", given_name = "Tim" },
]

# A work this site does publish a landing page for: the site claims no DOI of
# its own, but a page of it is still where this dataset's DOI resolves, so the
# site is the whole that page's work is a part of.
[[project.citations]]
doi = "10.71929/rubin/3382539"
label = "Dataset"
type = "dataset"
page = "dataset"
title = "Butler test dataset"
publisher = "Vera C. Rubin Observatory"
date = 2025-06-30
authors = [{ name = "Vera C. Rubin Observatory" }]
